<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - ElectroShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="form-card" style="margin: auto; max-width: 400px;">
            <h1>Login</h1>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="error-message" style="color: red; text-align: center;"></p>
            <p style="text-align: center;">Don't have an account? <a href="/register.html">Register</a></p>
        </div>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                window.location.href = '/'; // Redirect to main dashboard on success
            } else {
                errorMessage.textContent = 'Invalid username or password.';
            }
        });
    </script>
</body>
</html>
