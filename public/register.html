<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ElectroShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="form-card" style="margin: auto; max-width: 400px;">
            <h1>Register New User</h1>
            <form id="register-form">
                <input type="text" id="username" placeholder="Choose a Username" required>
                <input type="password" id="password" placeholder="Choose a Password" required>
                <button type="submit">Register</button>
            </form>
            <p id="message" style="text-align: center;"></p>
            <p style="text-align: center;">Already have an account? <a href="/login.html">Login</a></p>
        </div>
    </main>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            // KEY DIFFERENCE: This sends data to the /api/register endpoint
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                messageEl.textContent = 'Registration successful! Redirecting to login...';
                messageEl.style.color = 'green';
                setTimeout(() => {
                    window.location.href = '/login.html'; // Redirect to login page on success
                }, 2000);
            } else {
                messageEl.textContent = 'Username may already be taken.';
                messageEl.style.color = 'red';
            }
        });
    </script>
</body>
</html>
